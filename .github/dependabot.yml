version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      cloudflare:
        patterns: ["wrangler", "@cloudflare/*", "agents"]
      mcp:
        patterns: ["@modelcontextprotocol/*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
